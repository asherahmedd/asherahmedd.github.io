<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Portfolio Starter</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a2230;background:#f6f7f9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:#006ed4;text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1060px;margin:auto;padding:0 22px}header{background:#fff;border-bottom:1px solid #e8ebef}nav{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:70px;flex-wrap:wrap}.brand{font-weight:800;color:#162336}.links{display:flex;gap:17px;font-size:13px;flex-wrap:wrap}.hero{padding:82px 0 58px}.eyebrow{color:#006bd9;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(38px,6vw,65px);line-height:1.06;letter-spacing:-.055em;margin:16px 0}h2{font-size:28px;letter-spacing:-.035em}.lede{font-size:19px;color:#4c5a6a;max-width:690px;line-height:1.5}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.button{padding:12px 19px;background:#006fe8;color:#fff;border-radius:11px;font-weight:700;font-size:13px}.button.secondary{background:#e8f1ff;color:#005dad}.section{margin-bottom:26px}.panel{background:white;border:1px solid #e5e9ef;border-radius:22px;padding:26px;box-shadow:0 7px 22px #24344c08}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.project{background:#fff;border:1px solid #e5e9ef;border-radius:18px;padding:23px}.project h3{margin:0 0 9px}.project p,.muted{color:#647386;font-size:14px;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#eef4fb;border-radius:9px;padding:8px 12px;font-size:12px;color:#315a7c}.contact{display:flex;gap:15px;flex-wrap:wrap}footer{padding:25px 0 45px;color:#87909b;font-size:12px}@media(max-width:650px){.hero{padding:56px 0 35px}.grid{grid-template-columns:1fr}.panel{padding:20px}nav{padding:13px 0}}
</style></head><body>
<header><nav class="wrap"><a class="brand" href="#top" id="brand"></a><div class="links"><a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a><a href="setup.html">Customize</a></div></nav></header>
<main class="wrap"><section class="hero" id="top"><span class="eyebrow" id="role"></span><h1 id="name"></h1><p class="lede" id="headline"></p><div class="buttons"><a class="button" href="#projects">Explore projects</a><a class="button secondary" href="#contact">Contact me</a></div></section>
<section id="about" class="section panel"><span class="eyebrow">INTRODUCTION</span><h2>About me</h2><p class="muted" id="about-text"></p><div class="tags" id="skills"></div></section>
<section id="projects" class="section"><span class="eyebrow">SELECTED WORK</span><h2>Projects</h2><div class="grid" id="project-grid"></div></section>
<section id="contact" class="section panel"><span class="eyebrow">LET'S CONNECT</span><h2>Get in touch.</h2><p class="muted" id="location"></p><div class="contact" id="contacts"></div></section></main>
<footer class="wrap">Built with the open-source Portfolio Starter · <a href="privacy.html">Privacy & analytics opt-out</a></footer>
<script src="config.js"></script><script>
(()=>{'use strict';const c=window.PORTFOLIO_CONFIG||{},sel=id=>document.getElementById(id),str=v=>String(v||'');function txt(id,value){sel(id).textContent=str(value)}
txt('brand',c.name||'Portfolio');txt('name',c.name||'Your Name');txt('role',c.role||'Professional');txt('headline',c.headline);txt('about-text',c.about);txt('location',c.location);
document.title=str(c.name||'Portfolio')+' | Portfolio';
for(const s of c.skills||[]){const tag=document.createElement('span');tag.className='tag';tag.textContent=str(s);sel('skills').append(tag)}
for(const p of c.projects||[]){const box=document.createElement('article');box.className='project';const h=document.createElement('h3');h.textContent=str(p.title);const d=document.createElement('p');d.textContent=str(p.description);box.append(h,d);if(/^https?:\/\//.test(p.url||'')){const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View project ↗';box.append(a)}sel('project-grid').append(box)}
const links=[['Email',c.email?'mailto:'+c.email:''],['WhatsApp',c.phone?'https://wa.me/'+c.phone.replace(/\D/g,''):''],['GitHub',c.github],['LinkedIn',c.linkedin]];for(const [label,url] of links){if(!url)continue;const a=document.createElement('a');a.className='button secondary';a.href=url;a.textContent=label+' ↗';if(url.startsWith('http')){a.target='_blank';a.rel='noopener noreferrer'}sel('contacts').append(a)}
if(/^https:\/\/[a-z0-9.-]+$/i.test(c.workerUrl||'')){const s=document.createElement('script');s.src='analytics/tracker.js';s.dataset.endpoint=c.workerUrl;s.defer=true;document.body.append(s)}
})();
</script></body></html>
