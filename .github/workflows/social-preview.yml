name: Generate social preview PNG

on:
  push:
    branches: [main]
    paths:
      - social-preview.svg
      - .github/workflows/social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to social-preview.png
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="social-preview.svg", write_to="social-preview.png", output_width=1200, output_height=630)
          PY
      - name: Commit generated preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate social preview PNG from SVG"
            git push
          fi
